/* ------------------------------------------------ alternative routes */
function RoutesModal({ onSwitched, onClose }) {
  const [data, setData] = useState(null);
  const [busy, setBusy] = useState(null);

  useEffect(() => { api("/api/routes").then(setData).catch(() => setData({ routes: [] })); }, []);

  const choose = async (strategy) => {
    setBusy(strategy);
    try {
      const res = await api("/api/strategy", "POST", { strategy });
      await onSwitched(res);
      onClose();
    } catch (e) { setBusy(null); }
  };

  return (
    <Modal onClose={onClose} wide>
      <header className="flex items-start justify-between gap-4 bg-sky p-6">
        <div>
          <div className="text-[10.5px] font-bold uppercase tracking-wider text-[#1E4E8C]">
            Same destination
          </div>
          <h3 className="mt-1.5 text-[22px] font-extrabold leading-tight tracking-tight text-ink">
            Five routes to the same skills
          </h3>
          {data && <p className="mt-1.5 max-w-xl text-[12px] leading-relaxed text-ink/70">{data.sentence}</p>}
        </div>
        <button onClick={onClose}
          className="rounded-full bg-white/70 px-3.5 py-1.5 text-[12px] font-bold text-ink transition hover:bg-white">
          close
        </button>
      </header>
      <div className="p-6">
        {!data && <div className="flex items-center gap-2 text-[13px] text-muted"><Spinner /> comparing routes...</div>}
        <div className="space-y-2.5">
          {(data ? data.routes : []).map(r => {
            const current = data.current_strategy === r.strategy;
            return (
              <div key={r.strategy}
                className={"rounded-3xl p-4 transition " + (current ? "bg-ink text-white" : "bg-cream")}>
                <div className="flex flex-wrap items-center justify-between gap-3">
                  <div className="min-w-0">
                    <div className="flex items-center gap-2">
                      <span className="text-[14px] font-bold">{r.label}</span>
                      {current && <Chip className="bg-white/20 text-white">current</Chip>}
                    </div>
                    <p className={"mt-1 text-[12px] " + (current ? "text-white/70" : "text-muted")}>
                      {r.blurb}
                    </p>
                  </div>
                  <div className="flex shrink-0 items-center gap-4 text-right">
                    <div>
                      <div className="text-[15px] font-extrabold leading-tight">{r.courses}</div>
                      <div className={"text-[10px] uppercase " + (current ? "text-white/60" : "text-muted")}>courses</div>
                    </div>
                    <div>
                      <div className="text-[15px] font-extrabold leading-tight">{r.hours}h</div>
                      <div className={"text-[10px] uppercase " + (current ? "text-white/60" : "text-muted")}>
                        {r.hours_vs_baseline === 0 ? "baseline" : (r.hours_vs_baseline > 0 ? "+" : "") + r.hours_vs_baseline + "h"}
                      </div>
                    </div>
                    <button onClick={() => choose(r.strategy)} disabled={current || busy}
                      className={"rounded-full px-3.5 py-2 text-[12px] font-bold transition disabled:opacity-40 " +
                        (current ? "bg-white/20 text-white" : "bg-ink text-white hover:bg-black")}>
                      {busy === r.strategy ? "switching..." : current ? "in use" : "use this"}
                    </button>
                  </div>
                </div>
                <div className={"mt-2.5 flex flex-wrap gap-x-4 gap-y-1 text-[11px] " +
                  (current ? "text-white/70" : "text-muted")}>
                  <span>{r.free_courses} free</span>
                  <span>{r.project_courses} project-based</span>
                  <span>avg {r.avg_course_hours}h per course</span>
                  <span>{r.shared_with_baseline} courses shared with the baseline</span>
                </div>
              </div>
            );
          })}
        </div>
        <p className="mt-4 text-[11.5px] leading-relaxed text-muted">
          The graph fixes what you must learn and in what order. A route only changes which
          course covers each skill, so every one of these is equally valid.
        </p>
      </div>
    </Modal>
  );
}

/* ------------------------------------------------------ goal comparison */
function CompareModal({ learner, onClose }) {
  const [goal, setGoal] = useState("");
  const [res, setRes] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);

  const run = async () => {
    if (!goal.trim()) return;
    setBusy(true); setErr(null);
    try {
      const r = await api("/api/compare", "POST", { goal_b: goal });
      if (r.status === "needs_clarification") { setErr(r.message); setRes(null); }
      else setRes(r);
    } catch (e) { setErr(e.message); } finally { setBusy(false); }
  };

  const col = (n) => n === 0 ? "text-muted" : "text-ink";

  return (
    <Modal onClose={onClose} wide>
      <header className="flex items-start justify-between gap-4 bg-peach p-6">
        <div>
          <div className="text-[10.5px] font-bold uppercase tracking-wider text-[#8A5713]">
            What would a second goal cost?
          </div>
          <h3 className="mt-1.5 text-[22px] font-extrabold leading-tight tracking-tight text-ink">
            Compare goals
          </h3>
          <p className="mt-1.5 text-[12px] text-ink/70">
            Your current goal is <b>{(learner.target_skills || []).length ? learner.goal : "not set"}</b>.
            Name another and see how much of the path they share.
          </p>
        </div>
        <button onClick={onClose}
          className="rounded-full bg-white/70 px-3.5 py-1.5 text-[12px] font-bold text-ink transition hover:bg-white">
          close
        </button>
      </header>
      <div className="space-y-5 p-6">
        <div className="flex flex-wrap gap-2">
          <input value={goal} onChange={e => setGoal(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter") run(); }}
            placeholder="e.g. I want to fine-tune LLMs"
            className="min-w-0 flex-1 rounded-2xl border border-hair bg-cream/60 px-4 py-2.5 text-[13px] outline-none transition placeholder:text-muted focus:border-ink/25 focus:bg-surf" />
          <button onClick={run} disabled={busy}
            className="rounded-2xl bg-ink px-4 py-2.5 text-[13px] font-bold text-white transition hover:bg-black disabled:opacity-50">
            {busy ? "comparing..." : "Compare"}
          </button>
        </div>
        <div className="flex flex-wrap gap-1.5">
          {["I want to fine-tune LLMs", "I want to do MLOps", "I want to do computer vision",
            "I want to do time series forecasting"].map(q => (
            <button key={q} onClick={() => setGoal(q)}
              className="rounded-full bg-cream px-2.5 py-1.5 text-[11px] font-semibold text-ink2 transition hover:bg-hair/70">
              {q.replace("I want to ", "")}
            </button>
          ))}
        </div>

        {err && <div className="rounded-2xl bg-blush/60 px-4 py-3 text-[12.5px] text-[#93313C]">{err}</div>}

        {res && (
          <div className="space-y-4">
            <div className="rounded-3xl bg-cream p-4 text-[13px] leading-relaxed text-ink2">
              {res.sentence}
            </div>

            <div className="grid gap-2.5 sm:grid-cols-3">
              {[["Only " + res.labels[0], res.only_a.length, "#1E4E8C", res.only_a],
                ["Shared", res.shared_courses.length, "#4B3A9E", res.shared_courses],
                ["Only " + res.labels[1], res.only_b.length, "#8A5713", res.only_b]].map(
                ([label, n, colour, list]) => (
                <div key={label} className="rounded-3xl bg-cream p-4">
                  <div className="text-[22px] font-extrabold leading-none" style={{ color: colour }}>{n}</div>
                  <div className="mt-1 text-[11px] font-semibold uppercase tracking-wide text-muted">
                    {label.length > 22 ? label.slice(0, 22) + "..." : label}
                  </div>
                  <div className="mt-2 space-y-1">
                    {list.slice(0, 3).map(c => (
                      <div key={c.course_id} className="truncate text-[11px] text-ink2">{c.title}</div>
                    ))}
                    {list.length > 3 && <div className="text-[11px] text-muted">+{list.length - 3} more</div>}
                  </div>
                </div>
              ))}
            </div>

            <div className="grid gap-2.5 sm:grid-cols-2">
              <div className="rounded-3xl bg-mint/40 p-4">
                <div className="text-[11px] font-bold uppercase tracking-wide text-[#1F6B4C]">
                  Both goals together
                </div>
                <div className="mt-1 text-[20px] font-extrabold text-ink">
                  {res.both.courses} courses - {res.both.hours}h
                </div>
                <div className="mt-1 text-[11.5px] text-ink2">
                  against {res.marginal.separately_courses} courses and{" "}
                  {res.marginal.separately_hours}h if you did them separately - a saving of{" "}
                  <b>{res.marginal.saved_hours}h</b>.
                </div>
              </div>
              <div className="rounded-3xl bg-lilac/50 p-4">
                <div className="text-[11px] font-bold uppercase tracking-wide text-[#4B3A9E]">
                  Marginal cost of the second goal
                </div>
                <div className="mt-1 text-[20px] font-extrabold text-ink">
                  +{res.marginal.courses} courses - +{res.marginal.hours}h
                </div>
                <div className="mt-1 text-[11.5px] text-ink2">
                  {res.overlap_percent}% of the two paths overlap, so most of the work counts twice.
                </div>
              </div>
            </div>
          </div>
        )}
      </div>
    </Modal>
  );
}

  );
}

/* ---------------------------------------------------------------- toast */
function Toast({ toast }) {
  if (!toast) return null;
  return (
    <div className="fixed bottom-5 right-5 z-50 max-w-sm toast-in">
      <div className="rounded-3xl bg-surf px-5 py-4 shadow-lift">
        <div className="flex items-center gap-2 text-[13px] font-bold text-ink">
          <span className="grid h-5 w-5 place-items-center rounded-full bg-mint text-[#1F6B4C]">
            <Icon.check className="h-3 w-3" />
          </span>
          {toast.title}
        </div>
        {toast.body && <div className="mt-1 text-[12px] leading-relaxed text-ink2">{toast.body}</div>}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ app */
function App() {
  const [health, setHealth] = useState(null);
  const [learner, setLearner] = useState(null);
  const [path, setPath] = useState(null);
  const [loading, setLoading] = useState(true);
  const [busy, setBusy] = useState(false);
  const [busyId, setBusyId] = useState(null);
  const [recomputing, setRecomputing] = useState(false);
  const [recomputeKey, setRecomputeKey] = useState(0);
  const [why, setWhy] = useState(null);
  const [toast, setToast] = useState(null);
  const [tab, setTab] = useState("profile");
  const [filter, setFilter] = useState("all");
  const [slots, setSlots] = useState(null);     // slot windows + critical flags
  const [skill, setSkill] = useState(null);      // skill id open in the inspector
  const [browser, setBrowser] = useState(false); // browse-the-graph modal
  const [about, setAbout] = useState(false);     // how-this-works modal
  const [routes, setRoutes] = useState(false);   // alternative routes
  const [compare, setCompare] = useState(false); // goal comparison
  const [insights, setInsights] = useState(false); // leverage / critical path / health

  const flash = (title, body) => {
    setToast({ title, body });
    setTimeout(() => setToast(null), 6000);
  };

  useEffect(() => {
    // health first: it reports whether a learner exists, so a fresh session
    // never fires a /api/learner request that is guaranteed to 404
    api("/api/health")
      .then(h => {
        setHealth(h);
        if (!h.has_learner) return null;
        return api("/api/learner")
          .then(d => { setLearner(d.learner); setPath(d.path); setTab("ask"); loadSchedule(); });
      })
      .catch(() => {})
      .finally(() => setLoading(false));
  }, []);

  const loadSchedule = () => api("/api/schedule")
    .then(r => setSlots(r.slots || {})).catch(() => setSlots(null));

  const applyPath = (res) => {
    setLearner(res.learner);
    setPath(res.path);
    loadSchedule();
    setRecomputeKey(k => k + 1);
    setFilter(f => (f === "all" || res.path.milestones.some(m => m.name === f)) ? f : "all");
  };

  const onCreated = async (res) => {
    const plan = await api("/api/plan", "POST");
    setLearner(plan.learner); setPath(plan.path); setTab("ask");
    setFilter("all"); setRecomputeKey(k => k + 1); loadSchedule();
    api("/api/health").then(setHealth).catch(() => {});
    const implied = (res.implied_skills || []).length;
    if (res.kept_progress) {
      flash("Goal updated, progress kept",
        `Replanned from where you are: ${res.completed_carried_over} completed course(s) and ` +
        `${plan.path.possessed.length} skills carried over. ${plan.path.total_courses} courses ` +
        `(${plan.path.total_hours}h) to reach ${res.targets_named.join(", ")}.`);
    } else {
      const how = (res.extraction && res.extraction.matches && res.extraction.matches[0]) || null;
      const read = how ? ` Read via ${how.method}: ${how.evidence}.` : "";
      flash("Path computed from the graph",
        `${plan.path.total_courses} courses across ${plan.path.milestones.length} milestones, ` +
        `${plan.path.total_hours} hours. Targets: ${res.targets_named.join(", ")}` +
        (implied ? `. ${implied} extra skills credited from your prerequisites.` : ".") + read);
    }
  };

  const withRecompute = async (fn) => {
    setRecomputing(true);
    const started = Date.now();
    try {
      const res = await fn();
      const wait = Math.max(0, 420 - (Date.now() - started)); // make the recompute visible
      await new Promise(r => setTimeout(r, wait));
      applyPath(res);
      return res;
    } finally { setRecomputing(false); setBusyId(null); }
  };

  const onComplete = async (courseId) => {
    setBusyId(courseId);
    try {
      const res = await withRecompute(() => api("/api/complete", "POST", { course_id: courseId }));
      const d = res.delta;
      const removed = d.courses_before - d.courses_after;
      flash("Path recomputed",
        `Gained ${d.skills_gained_named.join(", ")}. ` +
        `${removed} course${removed === 1 ? "" : "s"} dropped out of the plan, ` +
        `${d.hours_before - d.hours_after}h saved. ${d.courses_after} courses left.`);
    } catch (e) { flash("Could not update", e.message); setBusyId(null); }
  };

  const onFeedback = async (courseId, signal) => {
    setBusyId(courseId);
    try {
      const res = await withRecompute(() => api("/api/feedback", "POST", { course_id: courseId, signal }));
      flash(signal === "already_know" ? "Skill marked as known" : "Course swapped", res.message);
    } catch (e) { flash("Could not update", e.message); setBusyId(null); }
  };

  const onReset = async () => {
    await api("/api/reset", "POST");
    setLearner(null); setPath(null); setTab("profile"); setFilter("all");
  };

  if (loading) {
    return (
      <div className="grid h-full place-items-center text-muted">
        <div className="flex items-center gap-2 text-[13px]"><Spinner /> loading graph...</div>
      </div>
    );
  }

  const hasPath = learner && path;
  const g = (health && health.graph) || {};

  return (
    <div className="flex min-h-full gap-4 p-3 lg:p-4">
      <Rail tab={tab} setTab={setTab} hasPath={hasPath} onReset={onReset}
        onBrowse={() => setBrowser(true)} onAbout={() => setAbout(true)}
        onRoutes={() => setRoutes(true)} onCompare={() => setCompare(true)}
        onInsights={() => setInsights(true)}
        browserOpen={browser} aboutOpen={about} />

      <main className="min-w-0 flex-1">
        {!hasPath ? (
          <div className="mx-auto max-w-3xl py-6">
            <div className="mb-7 text-center">
              <Chip className="bg-surf text-ink2 shadow-soft">
                <span className="h-1.5 w-1.5 rounded-full bg-ink" />
                {g.skills || "-"} skills - {g.edges || "-"} prerequisite edges - {g.courses || "-"} courses
              </Chip>
              <h1 className="mt-4 text-[40px] font-extrabold leading-[1.05] tracking-tight text-ink md:text-[52px]">
                Invest in your<br />education
              </h1>
              <p className="mx-auto mt-4 max-w-xl text-[14px] leading-relaxed text-ink2">
                Tell me your goal. The plan is the transitive closure of what it requires,
                minus what you already know, sorted topologically. No language model invents
                your curriculum.
              </p>
            </div>
            <Card className="overflow-hidden">
              <IntakePanel onCreated={onCreated} busy={busy} setBusy={setBusy} />
            </Card>
          </div>
        ) : (
          <div className="grid gap-4 lg:grid-cols-[minmax(0,1fr)_330px] 2xl:grid-cols-[340px_minmax(0,1fr)_330px]">

            {/* left panel: profile / ask */}
            <div className="lg:col-start-2 lg:row-start-1 2xl:col-start-1 2xl:row-start-1">
              <Card className="flex max-h-[calc(100vh-2rem)] flex-col overflow-hidden 2xl:sticky 2xl:top-4">
                <div className="flex items-center gap-1.5 border-b border-hair p-3">
                  {[["profile", "Profile"], ["ask", "Ask"]].map(([id, label]) => (
                    <button key={id} onClick={() => setTab(id)}
                      className={"rounded-full px-3.5 py-1.5 text-[11.5px] font-bold uppercase tracking-wider transition " +
                        (tab === id ? "bg-ink text-white" : "text-muted hover:bg-cream hover:text-ink")}>
                      {label}
                    </button>
                  ))}
                </div>
                <div className="min-h-0 flex-1 overflow-hidden">
                  {tab === "ask"
                    ? <ChatPanel path={path} learner={learner} />
                    : <div className="scroll-y h-full">
                        <IntakePanel onCreated={onCreated} busy={busy} setBusy={setBusy}
                          compact existing={learner} />
                      </div>}
                </div>
              </Card>
            </div>

            {/* center: the roadmap */}
            <div className="lg:col-start-1 lg:row-start-1 lg:row-span-2 2xl:col-start-2 2xl:row-span-1">
              <div className="px-1 pb-4 pt-2">
                <h1 className="text-[34px] font-extrabold leading-[1.08] tracking-tight text-ink md:text-[40px]">
                  Your roadmap to<br />
                  <span className="box-decoration-clone bg-lilac px-2 leading-[1.35]">
                    {path.targets_named.join(" + ")}
                  </span>
                </h1>
                <p className="mt-3 max-w-2xl text-[13px] text-ink2">
                  A topological order of the {path.progress.skills_remaining} skills you still need.
                  Hover a card to see which courses feed it and which it unblocks.
                </p>
              </div>

              {/* phase filter pills, in the style of the reference UI */}
              <div className="mb-4 flex flex-wrap items-center gap-2 px-1">
                <button onClick={() => setFilter("all")}
                  className={"flex items-center gap-2 rounded-full px-4 py-2.5 text-[12.5px] font-bold transition " +
                    (filter === "all" ? "bg-ink text-white" : "bg-surf text-ink2 shadow-soft hover:bg-white")}>
                  <Icon.grid className="h-3.5 w-3.5" /> All
                </button>
                {path.milestones.map(ms => {
                  const col = phase(ms.name);
                  const on = filter === ms.name;
                  return (
                    <button key={ms.name} onClick={() => setFilter(on ? "all" : ms.name)}
                      style={on ? {} : { background: col.bg, color: col.deep }}
                      className={"flex items-center gap-2 rounded-full px-4 py-2.5 text-[12.5px] font-bold transition hover:brightness-95 " +
                        (on ? "bg-ink text-white" : "")}>
                      {ms.name}
                      <span className={"rounded-full px-1.5 py-0.5 text-[10px] " +
                        (on ? "bg-white/20" : "bg-white/60")}>{ms.course_ids.length}</span>
                    </button>
                  );
                })}
              </div>

              <Roadmap path={path} filter={filter} onWhy={setWhy} onComplete={onComplete}
                onFeedback={onFeedback} onSkill={setSkill} slots={slots} busyId={busyId}
                recomputing={recomputing} recomputeKey={recomputeKey} />
            </div>

            {/* right: dashboard */}
            <div className="lg:col-start-2 lg:row-start-2 2xl:col-start-3 2xl:row-start-1">
              <div className="2xl:sticky 2xl:top-4 2xl:max-h-[calc(100vh-2rem)] 2xl:overflow-y-auto 2xl:pr-1">
                <Dashboard path={path} learner={learner} health={health} onWhy={setWhy}
                  onSkill={setSkill} onReset={onReset} />
              </div>
            </div>
          </div>
        )}
      </main>

      {why && <WhyModal courseId={why} onSkill={setSkill} onClose={() => setWhy(null)} />}
      {skill && <SkillModal skillId={skill} onOpenSkill={setSkill} onClose={() => setSkill(null)} />}
      {browser && <BrowserModal onOpenSkill={id => { setBrowser(false); setSkill(id); }}
        onClose={() => setBrowser(false)} />}
      {about && <AboutModal health={health} onClose={() => setAbout(false)} />}
      {routes && <RoutesModal onClose={() => setRoutes(false)} onSwitched={async res => {
        applyPath(res); flash("Route switched", res.message);
      }} />}
      {compare && <CompareModal learner={learner} onClose={() => setCompare(false)} />}
      {insights && <InsightsModal onClose={() => setInsights(false)}
        onWhy={id => { setInsights(false); setWhy(id); }} />}
      <Toast toast={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
