<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Learning Path Recommender</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        cream:  '#F6F3EE',   // page background
        surf:   '#FFFFFF',   // cards / rails
        ink:    '#15161A',   // primary text
        ink2:   '#4A4E5A',   // secondary text
        muted:  '#8B8F9C',   // tertiary text
        hair:   '#EAE5DC',   // hairline borders
        // pastel milestone palette, taken from the reference UI
        blush:  '#F9D7DA', peach: '#FBE3C1', lilac: '#DDD6FB',
        mint:   '#C3EBD8', sky:   '#CFE1FA', sand:  '#F0E7DA',
      },
      fontFamily: {
        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif'],
      },
      boxShadow: {
        soft: '0 1px 2px rgba(21,22,26,.04), 0 8px 24px rgba(21,22,26,.05)',
        lift: '0 2px 6px rgba(21,22,26,.06), 0 18px 40px rgba(21,22,26,.10)',
      },
      borderRadius: { '4xl': '2rem' },
    }
  }
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html, body, #root { height: 100%; }
  body { background: #F6F3EE; color: #15161A; -webkit-font-smoothing: antialiased; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #E2DCD1; border-radius: 8px; border: 2px solid #F6F3EE; }
  ::-webkit-scrollbar-thumb:hover { background: #CFC7B8; }
  @keyframes riseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .rise { animation: riseIn .34s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
  .toast-in { animation: toastIn .22s ease-out both; }
  @keyframes pulseRing { 0% { box-shadow: 0 0 0 0 rgba(21,22,26,.18); } 70% { box-shadow: 0 0 0 12px rgba(21,22,26,0); } 100% { box-shadow: 0 0 0 0 rgba(21,22,26,0); } }
  .pulse-ring { animation: pulseRing 1.8s ease-out 2; }
  .link-line { transition: stroke .18s ease, stroke-width .18s ease, opacity .18s ease; }
  .scroll-y { overflow-y: auto; scrollbar-gutter: stable; }
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
</style>
</head>
<body class="font-sans">
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<script type="text/babel" data-presets="react">
/** @jsxRuntime classic */
/** @jsx React.createElement */
/** @jsxFrag React.Fragment */
/* The pragmas above matter: recent Babel defaults to the automatic JSX runtime,
   which emits `import ... from "react/jsx-runtime"` and dies in a classic
   <script>. Classic runtime compiles straight to React.createElement. */
const { useState, useEffect, useRef, useLayoutEffect, useCallback } = React;

/* ------------------------------------------------------------------ api */
async function api(path, method = "GET", body) {
  const res = await fetch(path, {
    method,
    headers: { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch (e) {}
    const err = new Error(detail); err.status = res.status; throw err;
  }
  return res.json();
}

/* --------------------------------------------------------------- theming */
const PHASE = {
  "Foundations":           { bg: "#C3EBD8", deep: "#1F6B4C", soft: "#E4F6EC" },
  "Data & Statistics":     { bg: "#CFE1FA", deep: "#1E4E8C", soft: "#E6EFFC" },
  "Core Machine Learning": { bg: "#DDD6FB", deep: "#4B3A9E", soft: "#EEEAFD" },
  "Deep Learning":         { bg: "#F9D7DA", deep: "#93313C", soft: "#FCEAEC" },
  "LLM Systems":           { bg: "#FBE3C1", deep: "#8A5713", soft: "#FDF1DF" },
  "Production & MLOps":    { bg: "#D9EFC9", deep: "#40682A", soft: "#EDF7E5" },
};
function phase(name) {
  if (!name) return PHASE["Foundations"];
  const base = String(name).replace(/ (II|III|IV)$/, "");
  return PHASE[base] || { bg: "#F0E7DA", deep: "#6B5836", soft: "#F8F2E9" };
}
const LEVEL_LABEL = { beginner: "Beginner", intermediate: "Intermediate", advanced: "Advanced" };

/* --------------------------------------------------------------- icons */
const Icon = {
  logo: p => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" {...p}>
    <circle cx="6" cy="18" r="2.2" /><circle cx="12" cy="6" r="2.2" /><circle cx="18" cy="14" r="2.2" />
    <path d="M7.6 16.2 10.6 8M13.9 7.6 16.4 11.9" /></svg>),
  home: p => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round" {...p}>
    <path d="M3 10.5 12 3l9 7.5" /><path d="M5.5 9.5V20h13V9.5" /></svg>),
  chat: p => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round" {...p}>
    <path d="M20 15a3 3 0 0 1-3 3H8l-4 3V6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3z" /></svg>),
  user: p => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round" {...p}>
    <circle cx="12" cy="8" r="3.4" /><path d="M4.5 20a7.5 7.5 0 0 1 15 0" /></svg>),
  book: p => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round" {...p}>
    <path d="M5 4h9a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z" /><path d="M17 7h2v13H8" /></svg>),
  grid: p => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" {...p}>
    <rect x="4" y="4" width="6.5" height="6.5" rx="2" /><rect x="13.5" y="4" width="6.5" height="6.5" rx="2" />
    <rect x="4" y="13.5" width="6.5" height="6.5" rx="2" /><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2" /></svg>),
  reset: p => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round" {...p}>
    <path d="M4 12a8 8 0 1 1 2.5 5.8" /><path d="M4 19v-5h5" /></svg>),
  check: p => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" {...p}>
    <path d="m5 12.5 4.5 4.5L19 7.5" /></svg>),
  routes: p => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round" {...p}>
    <path d="M4 19c0-6 5-6 5-12" /><path d="M20 5c0 6-5 6-5 12" />
    <circle cx="4" cy="20" r="1.6" /><circle cx="20" cy="4" r="1.6" /></svg>),
  scales: p => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round" {...p}>
    <path d="M12 4v16M5 8h14M7 8l-3 6h6zM17 8l-3 6h6z" /></svg>),
  chart: p => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round" {...p}>
    <path d="M4 20V10M10 20V4M16 20v-7M22 20H2" /></svg>),
  spark: p => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round" {...p}>
    <path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18" /></svg>),
};

/* ------------------------------------------------------------ atoms */
function Chip({ children, className = "", style, title, onClick }) {
  return (
    <span title={title} onClick={onClick} style={style}
      className={"inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[11px] font-semibold " +
        (onClick ? "cursor-pointer " : "") + className}>
      {children}
    </span>
  );
}

function Spinner({ className = "h-4 w-4" }) {
  return (
    <svg className={"animate-spin " + className} viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="9" stroke="currentColor" strokeWidth="3" className="opacity-20" />
      <path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" strokeWidth="3" strokeLinecap="round" />
    </svg>
  );
}

function Card({ children, className = "", style }) {
  return <div style={style} className={"rounded-4xl bg-surf shadow-soft " + className}>{children}</div>;
}

/* ----------------------------------------------------------- icon rail */
function Rail({ tab, setTab, hasPath, onReset, onBrowse, onAbout, onRoutes, onCompare,
                onInsights, browserOpen, aboutOpen }) {
  const item = (key, IconC, label, onClick, active) => (
    <button key={key} title={label} onClick={onClick}
      className={"grid h-11 w-11 place-items-center rounded-2xl transition " +
        (active ? "bg-ink text-white shadow-lift" : "text-ink2 hover:bg-cream")}>
      <IconC className="h-[18px] w-[18px]" />
    </button>
  );
  return (
    <aside className="hidden shrink-0 lg:block">
      <div className="sticky top-4 flex h-[calc(100vh-2rem)] w-16 flex-col items-center gap-2 rounded-4xl bg-surf py-4 shadow-soft">
        <div className="grid h-10 w-10 place-items-center rounded-2xl bg-ink text-white">
          <Icon.logo className="h-5 w-5" />
        </div>
        <div className="mt-3 flex flex-col items-center gap-1.5">
          {item("plan", Icon.home, "Roadmap", () => window.scrollTo({ top: 0, behavior: "smooth" }),
            !browserOpen && !aboutOpen)}
          {hasPath && item("ask", Icon.chat, "Ask about your path", () => setTab("ask"), tab === "ask")}
          {hasPath && item("profile", Icon.user, "Your profile", () => setTab("profile"), tab === "profile")}
          {hasPath && item("routes", Icon.routes, "Other routes to the same goal", onRoutes, false)}
          {hasPath && item("compare", Icon.scales, "Compare against another goal", onCompare, false)}
          {hasPath && item("insights", Icon.chart, "Leverage, critical path, graph health", onInsights, false)}
          {item("browse", Icon.book, "Browse the skill graph", onBrowse, browserOpen)}
          {item("about", Icon.grid, "About this graph", onAbout, aboutOpen)}
        </div>
        <div className="mt-auto flex flex-col items-center gap-2">
          {hasPath && item("reset", Icon.reset, "Start over", onReset, false)}
          <div className="h-9 w-9 rounded-full bg-gradient-to-br from-lilac to-blush" />
        </div>
      </div>
    </aside>
  );
}

/* --------------------------------------------------------- intake panel */
const INTEREST_PRESETS = ["llm", "rag", "nlp", "vision", "mlops", "tabular", "math", "projects", "free"];

function IntakePanel({ onCreated, busy, setBusy, compact, existing }) {
  const [goal, setGoal] = useState("");
  const [level, setLevel] = useState("beginner");
  const [known, setKnown] = useState([]);
  const [interests, setInterests] = useState([]);
  // Re-aiming an existing learner keeps their completed courses and skills by
  // default; starting fresh is still possible but has to be chosen explicitly.
  const [keepProgress, setKeepProgress] = useState(true);
  const [catalog, setCatalog] = useState([]);
  const [personas, setPersonas] = useState([]);
  const [query, setQuery] = useState("");
  const [showPicker, setShowPicker] = useState(false);
  const [graded, setGraded] = useState({});     // skill id -> heard_of|can_use|can_teach
  const [historyText, setHistoryText] = useState("");
  const [historyResult, setHistoryResult] = useState(null);
  const [showHistory, setShowHistory] = useState(false);
  const [error, setError] = useState(null);
  // when the parser is unsure it hands back candidates instead of a plan
  const [clarify, setClarify] = useState(null);
  const [picked, setPicked] = useState([]);

  useEffect(() => {
    api("/api/skills").then(d => setCatalog(d.skills)).catch(() => {});
    api("/api/personas").then(d => setPersonas(d.personas)).catch(() => {});
  }, []);

  useEffect(() => {
    if (!existing) return;
    setGoal(existing.goal || "");
    setLevel(existing.experience_level || "beginner");
    setInterests(existing.interests || []);
  }, [existing && existing.id]);

  const toggle = (list, setList, v) =>
    setList(list.includes(v) ? list.filter(x => x !== v) : list.concat([v]));

  const submit = async (explicitTargets) => {
    if (!goal.trim()) { setError("Describe what you want to be able to do."); return; }
    setError(null); setBusy(true);
    try {
      const res = await api("/api/intake", "POST", {
        goal, experience_level: level, known_skills: known, interests,
        keep_progress: !!existing && keepProgress,
        target_skills: explicitTargets || [],
        skill_levels: graded,
      });
      if (res.status === "needs_clarification") {
        setClarify(res); setPicked([]);      // ask instead of planning something wrong
        return;
      }
      setClarify(null); setPicked([]);
      await onCreated(res);
    } catch (e) { setError(e.message); } finally { setBusy(false); }
  };

  const byCategory = {};
  catalog.forEach(s => {
    if (query && !(s.name.toLowerCase().includes(query.toLowerCase()) || s.id.includes(query.toLowerCase()))) return;
    (byCategory[s.category] = byCategory[s.category] || []).push(s);
  });
  const nameOf = id => (catalog.find(s => s.id === id) || {}).name || id;

  return (
    <div className={"space-y-5 " + (compact ? "p-5" : "p-6 md:p-8")}>
      <div>
        <label className="mb-2 block text-[12.5px] font-semibold text-ink">
          What do you want to be able to do?
        </label>
        <textarea value={goal} onChange={e => { setGoal(e.target.value); if (clarify) setClarify(null); }}
          rows={compact ? 3 : 2}
          placeholder="e.g. I want to build RAG chatbots over our internal docs"
          className="w-full resize-none rounded-2xl border border-hair bg-cream/60 px-4 py-3 text-[14px] text-ink outline-none transition placeholder:text-muted focus:border-ink/25 focus:bg-surf focus:ring-4 focus:ring-ink/5" />
        <p className="mt-2 text-[11.5px] leading-relaxed text-muted">
          This sentence is the <i>only</i> thing the language model reads. It maps your words onto
          skill ids; the path itself comes from the graph.
        </p>
      </div>

      {personas.length > 0 && (
        <div>
          <div className="mb-2 text-[12.5px] font-semibold text-ink">Or load a demo persona</div>
          <div className="flex flex-wrap gap-2">
            {personas.map((p, i) => {
              const tone = [PHASE["Deep Learning"], PHASE["LLM Systems"], PHASE["Core Machine Learning"]][i % 3];
              return (
                <button key={p.name} onClick={() => {
                  setGoal(p.goal); setLevel(p.experience_level);
                  setKnown(p.known_skills); setInterests(p.interests);
                }}
                  style={{ background: tone.soft, color: tone.deep }}
                  className="rounded-full px-3 py-1.5 text-[11.5px] font-semibold transition hover:brightness-95">
                  {p.name}
                </button>
              );
            })}
          </div>
        </div>
      )}

      <div>
        <label className="mb-2 block text-[12.5px] font-semibold text-ink">Experience level</label>
        <div className="grid grid-cols-3 gap-2">
          {["beginner", "intermediate", "advanced"].map(l => (
            <button key={l} onClick={() => setLevel(l)}
              className={"rounded-2xl px-2 py-2.5 text-[12px] font-semibold capitalize transition " +
                (level === l ? "bg-ink text-white" : "bg-cream text-ink2 hover:bg-hair/70")}>
              {l}
            </button>
          ))}
        </div>
      </div>

      <div>
        <div className="mb-2 flex items-center justify-between">
          <label className="text-[12.5px] font-semibold text-ink">
            Skills you already have <span className="text-muted">({known.length})</span>
          </label>
          <button onClick={() => setShowPicker(v => !v)}
            className="text-[11.5px] font-semibold text-ink underline decoration-hair underline-offset-4 hover:decoration-ink">
            {showPicker ? "done" : "choose"}
          </button>
        </div>
        {known.length > 0 && (
          <div className="mb-2 flex flex-wrap gap-1.5">
            {known.map(id => (
              <Chip key={id} className="bg-ink text-white" onClick={() => toggle(known, setKnown, id)}>
                {nameOf(id)} <span className="opacity-60">x</span>
              </Chip>
            ))}
          </div>
        )}
        {showPicker && (
          <div className="overflow-hidden rounded-3xl border border-hair bg-cream/50">
            <input value={query} onChange={e => setQuery(e.target.value)} placeholder="filter skills..."
              className="w-full border-b border-hair bg-surf px-4 py-2.5 text-[12.5px] outline-none placeholder:text-muted" />
            <div className="scroll-y max-h-64 p-3">
              {Object.keys(byCategory).map(cat => (
                <div key={cat} className="mb-3">
                  <div className="px-1 pb-1.5 text-[10px] font-bold uppercase tracking-wider text-muted">{cat}</div>
                  <div className="flex flex-wrap gap-1.5">
                    {byCategory[cat].map(s => {
                      const lvl = graded[s.id];
                      const cycle = () => {
                        const next = lvl === undefined ? "heard_of"
                          : lvl === "heard_of" ? "can_use"
                            : lvl === "can_use" ? "can_teach" : undefined;
                        setGraded(g => {
                          const copy = { ...g };
                          if (next === undefined) delete copy[s.id]; else copy[s.id] = next;
                          return copy;
                        });
                        // keep the plain list in step: can_use and above are possessed
                        setKnown(k => (next === "can_use" || next === "can_teach")
                          ? (k.includes(s.id) ? k : k.concat([s.id]))
                          : k.filter(x => x !== s.id));
                      };
                      const style = lvl === undefined
                        ? { background: phase(cat).soft, color: phase(cat).deep }
                        : lvl === "heard_of" ? { background: "#FBE3C1", color: "#8A5713" } : {};
                      return (
                        <button key={s.id} onClick={cycle}
                          title={s.description + " - click to cycle: heard of / can use / can teach"}
                          style={style}
                          className={"rounded-full px-2.5 py-1 text-[11px] font-semibold transition hover:brightness-95 " +
                            (lvl === "can_use" || lvl === "can_teach" ? "bg-ink text-white" : "")}>
                          {s.name}
                          {lvl && <span className="ml-1 opacity-70">
                            {lvl === "heard_of" ? "heard of" : lvl === "can_use" ? "can use" : "can teach"}
                          </span>}
                        </button>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}
        <p className="mt-2 text-[11.5px] leading-relaxed text-muted">
          Click a skill to cycle through <b>heard of</b>, <b>can use</b> and <b>can teach</b>.
          Only "can use" and above count as known - "heard of" earns you a short refresher
          course instead of the full one. Anything you know also credits everything below it
          in the graph.
        </p>
      </div>

      <div>
        <label className="mb-2 block text-[12.5px] font-semibold text-ink">Interests (optional)</label>
        <div className="flex flex-wrap gap-1.5">
          {INTEREST_PRESETS.map(t => (
            <button key={t} onClick={() => toggle(interests, setInterests, t)}
              className={"rounded-full px-3 py-1.5 text-[11.5px] font-semibold transition " +
                (interests.includes(t) ? "bg-ink text-white" : "bg-cream text-ink2 hover:bg-hair/70")}>
              {t}
            </button>
          ))}
        </div>
      </div>

      {clarify && (
        <div className={"rounded-3xl p-4 " + (clarify.out_of_domain ? "bg-blush/50" : "bg-peach/50")}>
          <div className="flex items-start gap-2.5">
            <span className="mt-0.5 grid h-5 w-5 shrink-0 place-items-center rounded-full bg-ink text-[11px] font-bold text-white">?</span>
            <div className="min-w-0">
              <div className="text-[12.5px] font-bold text-ink">
                {clarify.out_of_domain ? "That is outside this graph" : "I am not sure I understood"}
              </div>
              <p className="mt-1 text-[11.5px] leading-relaxed text-ink2">{clarify.message}</p>

              {clarify.unknown_terms.length > 0 && (
                <p className="mt-1.5 text-[11px] text-ink2">
                  Nothing in the catalogue matches{" "}
                  {clarify.unknown_terms.slice(0, 4).map((t, i) => (
                    <span key={t} className="font-semibold">{i ? ", " : ""}"{t}"</span>
                  ))}.
                </p>
              )}

              {clarify.candidates.length > 0 && (
                <div className="mt-2.5 flex flex-wrap gap-1.5">
                  {clarify.candidates.map(c => (
                    <button key={c.skill_id}
                      title={c.evidence + " (score " + c.score + ")"}
                      onClick={() => setPicked(p =>
                        p.includes(c.skill_id) ? p.filter(x => x !== c.skill_id) : p.concat([c.skill_id]))}
                      className={"rounded-full px-3 py-1.5 text-[11.5px] font-semibold transition " +
                        (picked.includes(c.skill_id) ? "bg-ink text-white" : "bg-white/80 text-ink2 hover:bg-white")}>
                      {c.name}
                    </button>
                  ))}
                </div>
              )}

              <div className="mt-3 flex flex-wrap items-center gap-2">
                {clarify.candidates.length > 0 && (
                  <button onClick={() => submit(picked)} disabled={busy || picked.length === 0}
                    className="rounded-full bg-ink px-3.5 py-1.5 text-[11.5px] font-bold text-white transition hover:bg-black disabled:opacity-40">
                    Plan for {picked.length ? picked.length + " selected" : "these"}
                  </button>
                )}
                <button onClick={() => { setClarify(null); setPicked([]); }}
                  className="rounded-full bg-white/70 px-3.5 py-1.5 text-[11.5px] font-bold text-ink transition hover:bg-white">
                  Reword my goal
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

      <div>
        <div className="mb-2 flex items-center justify-between">
          <label className="text-[12.5px] font-semibold text-ink">Already done some of this?</label>
          <button onClick={() => setShowHistory(v => !v)}
            className="text-[11.5px] font-semibold text-ink underline decoration-hair underline-offset-4 hover:decoration-ink">
            {showHistory ? "hide" : "paste your history"}
          </button>
        </div>
        {showHistory && (
          <div className="space-y-2">
            <textarea value={historyText} rows={4}
              onChange={e => { setHistoryText(e.target.value); setHistoryResult(null); }}
              placeholder={"One per line, e.g.\nPython for Everybody\nDocker and Kubernetes for ML\nsql"}
              className="w-full resize-none rounded-2xl border border-hair bg-cream/60 px-4 py-3 text-[12.5px] outline-none transition placeholder:text-muted focus:border-ink/25 focus:bg-surf" />
            <div className="flex flex-wrap gap-2">
              <button disabled={!historyText.trim()}
                onClick={async () => {
                  try {
                    const r = await api("/api/import-history", "POST", { text: historyText });
                    setHistoryResult(r.parsed);
                    const ids = new Set(r.parsed.skills_direct);
                    setKnown(k => Array.from(new Set(k.concat(Array.from(ids)))));
                  } catch (e) { setError(e.message); }
                }}
                className="rounded-full bg-ink px-3.5 py-1.5 text-[11.5px] font-bold text-white transition hover:bg-black disabled:opacity-40">
                Read it
              </button>
              {historyResult && (
                <button onClick={() => { setHistoryText(""); setHistoryResult(null); }}
                  className="rounded-full bg-cream px-3.5 py-1.5 text-[11.5px] font-bold text-ink2 transition hover:bg-hair/70">
                  clear
                </button>)}
            </div>
            {historyResult && (
              <div className="rounded-3xl bg-mint/40 p-3.5">
                <div className="text-[12px] leading-relaxed text-ink2">{historyResult.sentence}</div>
                {historyResult.matched_courses.length > 0 && (
                  <div className="mt-2 flex flex-wrap gap-1.5">
                    {historyResult.matched_courses.map(c => (
                      <Chip key={c.course_id} className="bg-white/70 text-ink2" title={c.title}>
                        {c.teaches_named.join(", ")}
                      </Chip>))}
                  </div>)}
                {historyResult.unmatched.length > 0 && (
                  <div className="mt-2 text-[11px] text-[#93313C]">
                    Not recognised: {historyResult.unmatched.map(u => u.line).join("; ")}

      {existing && (
        <div className={"rounded-3xl p-4 transition " + (keepProgress ? "bg-mint/40" : "bg-blush/50")}>
          <label className="flex cursor-pointer items-start gap-3">
            <input type="checkbox" checked={keepProgress} onChange={e => setKeepProgress(e.target.checked)}
              className="mt-0.5 h-4 w-4 shrink-0 accent-[#15161A]" />
            <span>
              <span className="block text-[12.5px] font-semibold text-ink">
                Keep what I have already done
              </span>
              <span className="mt-0.5 block text-[11.5px] leading-relaxed text-ink2">
                {keepProgress
                  ? `Your ${(existing.completed_courses || []).length} completed course(s) and ` +
                    `${(existing.possessed || []).length} skills stay in your profile - the new goal is ` +
                    `planned from where you are now.`
                  : "Unticked, this discards your completed courses and starts a brand new learner from scratch."}
              </span>
            </span>
          </label>
        </div>
      )}

      {error && (
        <div className="rounded-2xl bg-blush/60 px-4 py-2.5 text-[12.5px] font-medium text-[#93313C]">{error}</div>
      )}

      <button onClick={() => submit()} disabled={busy}
        className="flex w-full items-center justify-center gap-2 rounded-2xl bg-ink px-4 py-3.5 text-[13.5px] font-bold text-white transition hover:bg-black disabled:opacity-60">
        {busy ? <Spinner /> : null}
        {busy ? "Computing your path..."
          : existing ? (keepProgress ? "Update my goal" : "Start a fresh plan")
            : "Build my path"}
      </button>
    </div>
  );
}

/* ----------------------------------------------------------- chat panel */
const QUICK = ["What should I start with?", "How long will this take?", "Why this order?", "How far along am I?"];

function ChatPanel({ path, learner }) {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [busy, setBusy] = useState(false);
  const endRef = useRef(null);

  useEffect(() => {
    setMessages([{
      role: "assistant", source: "deterministic",
      text: `Your path is ready: ${path.total_courses} courses, ${path.total_hours} hours, aiming at ` +
        path.targets_named.join(" and ") + ". Ask me anything about it.",
    }]);
  }, [learner.id]);

  useEffect(() => { if (endRef.current) endRef.current.scrollIntoView({ behavior: "smooth" }); }, [messages, busy]);

  const send = async (text) => {
    const msg = (text === undefined ? input : text).trim();
    if (!msg || busy) return;
    setInput(""); setMessages(m => m.concat([{ role: "user", text: msg }])); setBusy(true);
    try {
      const res = await api("/api/chat", "POST", { message: msg });
      setMessages(m => m.concat([{ role: "assistant", text: res.reply, source: res.source }]));
    } catch (e) {
      setMessages(m => m.concat([{ role: "assistant", text: "Something went wrong: " + e.message, source: "error" }]));
    } finally { setBusy(false); }
  };

  return (
    <div className="flex h-full min-h-0 flex-col">
      <div className="scroll-y min-h-0 flex-1 space-y-3 px-5 py-4">
        {messages.map((m, i) => (
          <div key={i} className={m.role === "user" ? "flex justify-end" : ""}>
            <div className={"max-w-[92%] rounded-3xl px-4 py-3 text-[13px] leading-relaxed " +
              (m.role === "user"
                ? "rounded-br-lg bg-ink text-white"
                : "rounded-bl-lg bg-cream text-ink2")}>
              {m.text}
              {m.role === "assistant" && m.source && (
                <div className="mt-2 text-[10px] font-semibold uppercase tracking-wider text-muted">
                  {m.source === "ollama" ? "reworded by ollama - facts from your path"
                    : m.source === "error" ? "error" : "answered from your path data"}
                </div>
              )}
            </div>
          </div>
        ))}
        {busy && <div className="flex items-center gap-2 text-[12px] text-muted"><Spinner className="h-3.5 w-3.5" /> thinking...</div>}
        <div ref={endRef} />
      </div>
      <div className="border-t border-hair p-4">
        <div className="mb-2.5 flex flex-wrap gap-1.5">
          {QUICK.map(q => (
            <button key={q} onClick={() => send(q)}
              className="rounded-full bg-cream px-2.5 py-1.5 text-[11px] font-semibold text-ink2 transition hover:bg-hair/70">
              {q}
            </button>
          ))}
        </div>
        <div className="flex gap-2">
          <input value={input} onChange={e => setInput(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter") send(); }}
            placeholder="Ask about your path..."
            className="min-w-0 flex-1 rounded-2xl border border-hair bg-cream/60 px-4 py-2.5 text-[13px] outline-none transition placeholder:text-muted focus:border-ink/25 focus:bg-surf" />
          <button onClick={() => send()} disabled={busy}
            className="rounded-2xl bg-ink px-4 py-2.5 text-[13px] font-bold text-white transition hover:bg-black disabled:opacity-50">
            Send
          </button>
        </div>
      </div>
    </div>
  );
}

/* -------------------------------------------------------------- roadmap */
function Roadmap({ path, filter, onWhy, onComplete, onFeedback, onSkill, slots, busyId, recomputing, recomputeKey }) {
  const containerRef = useRef(null);
  const cardRefs = useRef({});
  const [geo, setGeo] = useState({ edges: [], height: 0 });
  const [hovered, setHovered] = useState(null);

  const visible = path.milestones.filter(ms => filter === "all" || ms.name === filter);
  const visibleIds = new Set(
    path.courses.filter(c => filter === "all" || c.milestone === filter).map(c => c.course_id));

  // Measure card positions and derive the prerequisite links drawn in the gutter.
  // Only ever runs when the path or filter changes, or on resize: setting state
  // from a layout effect that runs on every render would loop forever.
  const measure = useCallback(() => {
    const cont = containerRef.current;
    if (!cont) return;
    const cb = cont.getBoundingClientRect();
    const pos = {};
    path.courses.forEach(c => {
      const el = cardRefs.current[c.course_id];
      if (el && el.isConnected) {
        const r = el.getBoundingClientRect();
        pos[c.course_id] = r.top - cb.top + Math.min(30, r.height / 2);
      }
    });
    const edges = [];
    path.courses.forEach(c => {
      (c.depends_on || []).forEach((src, i) => {
        if (pos[src] !== undefined && pos[c.course_id] !== undefined) {
          edges.push({ from: src, to: c.course_id, y1: pos[src], y2: pos[c.course_id], i });
        }
      });
    });
    const next = { edges, height: cont.scrollHeight };
    setGeo(prev => JSON.stringify(prev) === JSON.stringify(next) ? prev : next);
  }, [path, filter]);

  useLayoutEffect(() => { measure(); }, [measure]);
  useEffect(() => {
    const onResize = () => measure();
    window.addEventListener("resize", onResize);
    const t = setTimeout(measure, 150);   // again once webfonts have settled
    return () => { window.removeEventListener("resize", onResize); clearTimeout(t); };
  }, [measure]);

  const relatedIds = new Set();
  if (hovered) {
    const h = path.courses.find(c => c.course_id === hovered);
    if (h) { (h.depends_on || []).forEach(x => relatedIds.add(x)); (h.unlocks || []).forEach(x => relatedIds.add(x)); }
  }

  const done = path.progress.completed_courses || [];

  return (
    <div className="relative">
      {recomputing && (
        <div className="absolute inset-0 z-20 grid place-items-center rounded-4xl bg-cream/70 backdrop-blur-[2px]">
          <div className="flex items-center gap-2.5 rounded-full bg-surf px-5 py-3 text-[13px] font-semibold text-ink shadow-lift">
            <Spinner className="h-4 w-4" /> Recomputing your path from the graph...
          </div>
        </div>
      )}

      {done.length > 0 && (
        <details className="mb-4 rounded-4xl bg-mint/40 px-5 py-4">
          <summary className="flex items-center justify-between text-[12.5px] font-semibold text-[#1F6B4C]">
            <span className="flex items-center gap-2"><Icon.check className="h-3.5 w-3.5" />
              {done.length} course{done.length > 1 ? "s" : ""} completed</span>
            <span className="text-ink/50">{path.progress.hours_done}h logged</span>
          </summary>
          <div className="mt-3 space-y-1.5">
            {done.map(c => (
              <div key={c.course_id} className="flex flex-wrap items-center gap-2 text-[12px] text-ink/60">
                <span className="line-through decoration-ink/30">{c.title}</span>
                <span className="text-muted">{c.provider} - {c.hours}h</span>
              </div>
            ))}
          </div>
        </details>
      )}

      <div ref={containerRef} key={recomputeKey + "|" + filter} className="relative rise">
        {/* prerequisite links drawn in the left gutter */}
        <svg className="pointer-events-none absolute left-0 top-0 z-10" width="46" height={geo.height}
          style={{ overflow: "visible" }}>
          {geo.edges.map((e, idx) => {
            const active = hovered === e.from || hovered === e.to;
            // long-range links bow out further so they do not sit on top of
            // the short adjacent-card ones
            const bulge = Math.min(31, 12 + Math.abs(e.y2 - e.y1) / 55) + (e.i % 2) * 5;
            const d = `M 38 ${e.y1} C ${38 - bulge} ${e.y1}, ${38 - bulge} ${e.y2}, 38 ${e.y2}`;
            return (
              <g key={idx}>
                <path d={d} fill="none" className="link-line"
                  stroke={active ? "#15161A" : "#D8D0C3"}
                  strokeWidth={active ? 2.2 : 1.5}
                  opacity={hovered && !active ? 0.3 : 1} />
                <circle cx="38" cy={e.y2} r={active ? 3.4 : 2.4} className="link-line"
                  fill={active ? "#15161A" : "#D8D0C3"} opacity={hovered && !active ? 0.3 : 1} />
              </g>
            );
          })}
        </svg>

        <div className="ml-[46px] space-y-3">
          {visible.map((ms, mi) => {
            const col = phase(ms.name);
            const entries = path.courses.filter(c => c.milestone === ms.name);
            return (
              <div key={ms.name} className="space-y-3">
                <div className="flex items-center gap-3 pb-1 pt-4">
                  <span className="grid h-7 w-7 place-items-center rounded-full text-[11px] font-bold text-white"
                    style={{ background: col.deep }}>{ms.index + 1}</span>
                  <h3 className="text-[13.5px] font-bold uppercase tracking-wider" style={{ color: col.deep }}>{ms.name}</h3>
                  <span className="h-px flex-1" style={{ background: col.bg }} />
                  <span className="text-[11.5px] font-semibold text-muted">{entries.length} courses - {ms.hours}h</span>
                </div>
                {entries.map(entry => (
                  <CourseCard key={entry.course_id} entry={entry}
                    cardRef={el => {
                      if (el) cardRefs.current[entry.course_id] = el;
                      else delete cardRefs.current[entry.course_id];
                    }}
                    isNext={entry.order === 0}
                    hovered={hovered} setHovered={setHovered}
                    related={relatedIds.has(entry.course_id)}
                    onWhy={onWhy} onComplete={onComplete} onFeedback={onFeedback}
                    onSkill={onSkill} slot={(slots || {})[entry.course_id]} busyId={busyId} />
                ))}
              </div>
            );
          })}
        </div>
      </div>

      {path.courses.length === 0 && (
        <div className="rounded-4xl bg-mint/50 p-10 text-center">
          <div className="text-[17px] font-bold text-[#1F6B4C]">Path complete</div>
          <p className="mx-auto mt-1.5 max-w-sm text-[13px] text-ink/60">
            Every skill your goal requires is now in your profile. Set a new goal to keep going.
          </p>
        </div>
      )}
    </div>
  );
}

/* ------------------------------------------------------------ dashboard */
function Bar({ value, max, color = "#15161A", track = "#EFEAE1" }) {
  const pct = max > 0 ? Math.min(100, Math.round((value / max) * 100)) : 0;
  return (
    <div className="h-2 w-full overflow-hidden rounded-full" style={{ background: track }}>
      <div className="h-full rounded-full transition-all duration-700"
        style={{ width: pct + "%", background: color }} />
    </div>
  );
}

function ForecastCard({ path }) {
  const [hpw, setHpw] = useState(10);
  const [weeks, setWeeks] = useState("");
  const [data, setData] = useState(null);

  useEffect(() => {
    const q = `/api/forecast?hours_per_week=${hpw}` + (weeks ? `&weeks_available=${weeks}` : "");
    const t = setTimeout(() => { api(q).then(setData).catch(() => setData(null)); }, 200);
    return () => clearTimeout(t);
  }, [hpw, weeks, path.total_hours, path.total_courses]);

  const v = data && data.velocity;
  const b = data && data.budget;
  const short = b && b.reachable_courses < b.total_courses;

  return (
    <Card className="p-5">
      <div className="flex items-center justify-between">
        <span className="text-[12.5px] font-bold text-ink">Time budget</span>
        {v && v.pace_factor !== 1 && (
          <Chip className="bg-peach/70 text-[#8A5713]">your pace {v.pace_factor}x</Chip>)}
      </div>

      <div className="mt-3">
        <div className="flex items-center justify-between text-[12px] text-muted">
          <span>Hours per week</span><span className="font-bold text-ink">{hpw}h</span>
        </div>
        <input type="range" min="1" max="40" value={hpw} onChange={e => setHpw(+e.target.value)}
          className="mt-1.5 w-full accent-[#15161A]" />
      </div>

      <div className="mt-3 flex items-center gap-2">
        <span className="text-[12px] text-muted">Deadline</span>
        <input type="number" min="1" max="200" value={weeks} placeholder="none"
          onChange={e => setWeeks(e.target.value)}
          className="w-20 rounded-xl border border-hair bg-cream/60 px-2.5 py-1.5 text-[12px] outline-none focus:border-ink/25 focus:bg-surf" />
        <span className="text-[12px] text-muted">weeks</span>
      </div>

      {b && (
        <div className={"mt-3 rounded-3xl p-3.5 " + (short ? "bg-peach/50" : "bg-mint/40")}>
          <div className="text-[13px] font-bold text-ink">
            {v.remaining_hours_adjusted}h left - about {v.weeks_adjusted} weeks
          </div>
          <p className="mt-1 text-[11.5px] leading-relaxed text-ink2">{b.sentence}</p>
          {weeks && b.milestones_completed.length > 0 && (
            <p className="mt-1.5 text-[11px] text-muted">
              Finishes inside the deadline: {b.milestones_completed.join(", ")}
            </p>)}
        </div>
      )}
      {v && (
        <p className="mt-2 text-[11px] leading-relaxed text-muted">{v.note}</p>
      )}
    </Card>
  );
}

function RefresherCard({ path }) {
  const [prompts, setPrompts] = useState([]);
  useEffect(() => {
    api("/api/refreshers").then(r => setPrompts(r.prompts || [])).catch(() => setPrompts([]));
  }, [path.total_courses, path.total_hours]);
  if (!prompts.length) return null;
  return (
    <Card className="p-5">
      <div className="mb-3 flex items-center justify-between">
        <span className="text-[12.5px] font-bold text-ink">Worth a refresher</span>
        <Chip className="bg-cream text-muted">{prompts.length}</Chip>
      </div>
      <div className="space-y-2">
        {prompts.slice(0, 3).map(item => (
          <div key={item.skill} className="rounded-3xl bg-cream p-3.5">
            <div className="text-[12.5px] leading-relaxed text-ink2">{item.sentence}</div>
            {item.suggested_course && (
              <div className="mt-1.5 text-[11px] text-muted">

          </div>

function Dashboard({ path, learner, health, onWhy, onSkill, onReset }) {
  const p = path.progress;
  const next = path.next_action;
  const doneIds = new Set((p.completed_courses || []).map(c => c.course_id));
  // 0 hours must read as 0 weeks, not the 1-week floor used for partial weeks
  const weeks = path.total_hours ? Math.max(1, Math.round(path.total_hours / 10)) : 0;
  const maxHours = Math.max(1, ...path.milestones.map(m => m.hours));
  const ollamaOk = health && health.ollama && health.ollama.reachable;
  const nextPhase = next ? next.milestone : null;

  return (
    <div className="space-y-4">
      {/* profile */}
      <Card className="p-5">
        <div className="flex items-start justify-between">
          <Chip className="bg-cream text-ink2" title={ollamaOk
            ? "Ollama is reachable: it parses goals and rewords explanations. The path is still pure graph traversal."
            : "Ollama is not reachable. Goals are parsed by keyword matching and explanations are read off the graph. Nothing is degraded except phrasing."}>
            <span className={"h-1.5 w-1.5 rounded-full " + (ollamaOk ? "bg-[#1F6B4C]" : "bg-muted")} />
            {ollamaOk ? "LLM assist on" : "Deterministic mode"}
          </Chip>
          <button onClick={onReset} title="Start over"
            className="grid h-8 w-8 place-items-center rounded-full text-muted transition hover:bg-cream hover:text-ink">
            <Icon.reset className="h-4 w-4" />
          </button>
        </div>

        <div className="mt-2 flex flex-col items-center text-center">
          <div className="grid h-16 w-16 place-items-center rounded-full bg-gradient-to-br from-lilac to-blush text-ink">
            <Icon.spark className="h-7 w-7" />
          </div>
          <div className="mt-2.5 text-[15px] font-bold text-ink">Your plan</div>
          <p className="mt-0.5 line-clamp-2 text-[12px] italic text-muted">"{learner.goal}"</p>
        </div>

        <div className="mt-4 rounded-3xl bg-cream p-4">
          <div className="flex items-end justify-between">
            <span className="text-[12px] font-semibold text-ink2">Skills acquired</span>
            <span className="text-[13px] font-bold text-ink">{p.skills_done}<span className="text-muted"> / {p.skills_total}</span></span>
          </div>
          <div className="mt-2"><Bar value={p.skills_done} max={p.skills_total} track="#E4DED3" /></div>
          <div className="mt-1.5 text-[11px] text-muted">{p.percent}% of what your goal requires</div>
        </div>

        <div className="mt-2.5 grid grid-cols-3 gap-2">
          {[["Courses", path.total_courses], ["Hours", path.total_hours], ["Weeks", weeks]].map(([label, v]) => (
            <div key={label} className="rounded-2xl bg-cream px-3 py-2.5 text-center">
              <div className="text-[17px] font-extrabold leading-tight text-ink">{v}</div>
              <div className="text-[10px] font-semibold uppercase tracking-wide text-muted">{label} left</div>
            </div>
          ))}
        </div>
      </Card>

      <ForecastCard path={path} />
      <RefresherCard path={path} />

      {/* effort per milestone - the reference's activity chart */}
      <Card className="p-5">
        <div className="flex items-center justify-between">
          <span className="text-[12.5px] font-bold text-ink">Effort ahead</span>
          <Chip className="bg-cream text-ink2">by phase</Chip>
        </div>
        <div className="mt-3 flex items-baseline gap-2">
          <span className="text-[26px] font-extrabold leading-none tracking-tight text-ink">{path.total_hours}h</span>
          <Chip className="bg-peach/70 text-[#8A5713]">{p.hours_done}h logged</Chip>
        </div>
        <div className="mt-4 flex items-end justify-between gap-2">
          {path.milestones.map(ms => {
            const col = phase(ms.name);
            const h = 30 + Math.round((ms.hours / maxHours) * 74);
            const isNow = ms.name === nextPhase;
            return (
              <div key={ms.name} className="flex flex-1 flex-col items-center gap-1.5" title={`${ms.name}: ${ms.hours}h`}>
                <div className={"w-full rounded-2xl p-1 " + (isNow ? "ring-2 ring-ink" : "")}>
                  <div className="w-full rounded-xl" style={{ height: h, background: col.bg }} />
                </div>
                <span className="text-[9.5px] font-semibold text-muted">{ms.name.split(" ")[0].slice(0, 6)}</span>
              </div>
            );
          })}
          {path.milestones.length === 0 && <div className="text-[12px] text-muted">Nothing left to schedule.</div>}
        </div>
      </Card>

      {/* next action */}
      <Card className="p-5">
        <div className="mb-3 flex items-center justify-between">
          <span className="text-[12.5px] font-bold text-ink">Next recommended action</span>
        </div>
        {next ? (
          <div className="pulse-ring rounded-3xl p-4" style={{ background: phase(next.milestone).bg }}>
            <div className="text-[10px] font-bold uppercase tracking-wider" style={{ color: phase(next.milestone).deep }}>
              {next.milestone} - step {next.order + 1}
            </div>
            <div className="mt-1.5 text-[15px] font-bold leading-snug tracking-tight text-ink">{next.title}</div>
            <div className="mt-1 text-[11.5px] font-semibold text-ink/60">
              {next.provider} - {next.hours}h - {LEVEL_LABEL[next.level]}
            </div>
            <div className="mt-2.5 flex flex-wrap gap-1.5">
              {next.covers.map((sid, i) => (
                <Chip key={sid} className="bg-white/70 transition hover:bg-white"
                  style={{ color: phase(next.milestone).deep }} onClick={() => onSkill(sid)}>
                  + {next.covers_named[i]}
                </Chip>
              ))}
            </div>
            <button onClick={() => onWhy(next.course_id)}
              className="mt-3 rounded-full bg-white/80 px-3 py-1.5 text-[11.5px] font-bold text-ink transition hover:bg-white">
              Why is this first?
            </button>
          </div>
        ) : (
          <div className="rounded-3xl bg-mint/50 p-4 text-[13px] font-semibold text-[#1F6B4C]">
            Nothing left - your goal skills are all covered.
          </div>
        )}
      </Card>

      {/* milestones */}
      <Card className="p-5">
        <div className="mb-3 text-[12.5px] font-bold text-ink">Milestones</div>
        <div className="space-y-3">
          {path.milestones.map(ms => {
            const total = ms.course_ids.length;
            const done = ms.course_ids.filter(id => doneIds.has(id)).length;
            const col = phase(ms.name);
            return (
              <div key={ms.name}>
                <div className="mb-1.5 flex items-center justify-between text-[12px]">
                  <span className="flex items-center gap-2 font-semibold text-ink2">
                    <span className="h-2.5 w-2.5 rounded-full" style={{ background: col.bg }} />
                    {ms.name}
                  </span>
                  <span className="text-muted">{total} - {ms.hours}h</span>
                </div>
                <Bar value={done} max={total} color={col.deep} />
              </div>
            );
          })}
          {path.milestones.length === 0 && <div className="text-[12px] text-muted">No milestones left.</div>}
        </div>
      </Card>

      {/* goal + profile skills */}
      <Card className="space-y-3 p-5">
        <div>
          <div className="mb-2 text-[11px] font-bold uppercase tracking-wider text-muted">Target skills</div>
          <div className="flex flex-wrap gap-1.5">
            {path.targets.map((t, i) => (
              <Chip key={t} className="bg-ink text-white transition hover:bg-black"
                onClick={() => onSkill(t)}>{path.targets_named[i]}</Chip>
            ))}
          </div>
          <div className="mt-2 text-[10.5px] text-muted">
            extracted from your sentence by {learner.target_source === "ollama" ? "ollama" : "keyword matching"}
          </div>
        </div>
        <div>
          <div className="mb-2 text-[11px] font-bold uppercase tracking-wider text-muted">
            Already in your profile ({path.possessed.length})
          </div>
          <div className="flex flex-wrap gap-1.5">
            {path.possessed.slice(0, 12).map((sid, i) => (
              <Chip key={sid} className="bg-cream text-ink2 transition hover:bg-hair/70"
                onClick={() => onSkill(sid)}>{path.possessed_named[i]}</Chip>
            ))}
            {path.possessed.length > 12 && (
              <Chip className="bg-cream text-muted">+{path.possessed.length - 12} more</Chip>
            )}
          </div>
        </div>
      </Card>
    </div>
  );
}

/* ------------------------------------------------------------ why modal */
function Chain({ named, ids, onSkill }) {
  const rev = named.slice().reverse(); // goal -> ... -> skill
  const revIds = (ids || []).slice().reverse();
  return (
    <div className="flex flex-wrap items-center gap-1.5">
      {rev.map((n, i) => (
        <React.Fragment key={i}>
          <button onClick={() => revIds[i] && onSkill && onSkill(revIds[i])}
            title="Inspect this skill in the graph"
            className={"rounded-full px-3 py-1.5 text-[11.5px] font-semibold transition hover:brightness-110 " +
            (i === 0 ? "bg-ink text-white"
              : i === rev.length - 1 ? "bg-peach text-[#8A5713]"
                : "bg-cream text-ink2")}>
            {n}{i === 0 && rev.length > 1 ? "  (your goal)" : ""}
          </button>
          {i < rev.length - 1 && <span className="text-[10.5px] text-muted">requires</span>}
        </React.Fragment>
      ))}
    </div>
  );
}

function WhyModal({ courseId, onSkill, onClose }) {
  const [data, setData] = useState(null);
  const [err, setErr] = useState(null);
  const [impact, setImpact] = useState(null);   // what breaks if you skip it
  const [slot, setSlot] = useState(null);       // why it sits at this position

  useEffect(() => {
    setData(null); setErr(null); setImpact(null); setSlot(null);
    api("/api/explain/" + courseId).then(setData).catch(e => setErr(e.message));
    api("/api/skip-impact/" + courseId).then(r => setImpact(r.impact)).catch(() => {});
    api("/api/schedule").then(r => setSlot((r.slots || {})[courseId] || null)).catch(() => {});
  }, [courseId]);

  useEffect(() => {
    const onKey = e => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);

  const col = data ? phase(data.trace.milestone) : phase(null);

  return (
    <div className="fixed inset-0 z-50 flex items-start justify-center overflow-y-auto bg-ink/25 p-4 backdrop-blur-[3px]"
      onClick={onClose}>
      <div className="my-8 w-full max-w-3xl overflow-hidden rounded-4xl bg-surf shadow-lift rise"
        onClick={e => e.stopPropagation()}>
        {!data && !err && (
          <div className="flex items-center gap-2 p-10 text-[13px] text-muted"><Spinner /> tracing the graph...</div>
        )}
        {err && <div className="p-6 text-[13px] text-[#93313C]">{err}</div>}
        {data && (
          <div>
            <header className="flex items-start justify-between gap-4 p-6" style={{ background: col.bg }}>
              <div>
                <div className="text-[10.5px] font-bold uppercase tracking-wider" style={{ color: col.deep }}>
                  {data.trace.milestone} - step {data.trace.position.index} of {data.trace.position.total}
                </div>
                <h3 className="mt-1.5 text-[22px] font-extrabold leading-tight tracking-tight text-ink">{data.trace.title}</h3>
                <div className="mt-1 text-[12.5px] font-semibold text-ink/60">
                  {data.trace.provider} - {data.trace.hours}h - {LEVEL_LABEL[data.trace.level]}
                </div>
              </div>
              <button onClick={onClose}
                className="rounded-full bg-white/70 px-3.5 py-1.5 text-[12px] font-bold text-ink transition hover:bg-white">
                close
              </button>
            </header>

            <div className="space-y-6 p-6">
              <div>
                <h4 className="mb-3 text-[11px] font-bold uppercase tracking-wider text-muted">
                  Why it is in your path
                </h4>
                <div className="space-y-3">
                  {data.trace.teaches.map((t, i) => (
                    <div key={i} className="rounded-3xl bg-cream p-4">
                      <Chain named={t.chain_named} ids={t.chain} onSkill={onSkill} />
                      <p className="mt-3 text-[13px] leading-relaxed text-ink2">{t.sentence}</p>
                      <p className="mt-1.5 text-[11.5px] text-muted">{t.description}</p>
                    </div>
                  ))}
                </div>
              </div>

              <div className="grid gap-5 md:grid-cols-2">
                <div>
                  <h4 className="mb-2.5 text-[11px] font-bold uppercase tracking-wider text-muted">
                    Its prerequisites
                  </h4>
                  <div className="space-y-2">
                    {data.trace.prerequisites.length === 0 && (
                      <div className="text-[12.5px] text-muted">None - it is an entry point.</div>
                    )}
                    {data.trace.prerequisites.map((p, i) => (
                      <div key={i} className="flex items-start gap-2 text-[12.5px]">
                        <span className={"mt-1.5 h-1.5 w-1.5 shrink-0 rounded-full " +
                          (p.source.type === "unmet" ? "bg-[#93313C]" : "bg-[#1F6B4C]")} />
                        <span className="font-semibold text-ink2">{p.skill_name}</span>
                        <span className="text-muted">
                          {p.source.type === "already_known" ? "you already have it"
                            : p.source.type === "course" ? "from " + p.source.title
                              : "not yet covered"}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
                <div>
                  <h4 className="mb-2.5 text-[11px] font-bold uppercase tracking-wider text-muted">
                    What it unblocks
                  </h4>
                  <div className="space-y-2">
                    {data.trace.unlocks.length === 0 && (
                      <div className="text-[12.5px] text-muted">Nothing later depends on it - it serves your goal directly.</div>
                    )}
                    {data.trace.unlocks.map((u, i) => (
                      <div key={i} className="text-[12.5px]">
                        <span className="font-semibold text-ink2">{u.title}</span>
                        <span className="text-muted"> - needs {u.via_named.join(", ")}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              {slot && (
                <div>
                  <h4 className="mb-2.5 text-[11px] font-bold uppercase tracking-wider text-muted">
                    Why here and not earlier
                  </h4>
                  <div className="rounded-3xl bg-cream p-4">
                    <div className="flex flex-wrap items-center gap-2">
                      <Chip className="bg-ink text-white">step {slot.position}</Chip>
                      <span className="text-[12px] text-muted">
                        valid anywhere in steps {slot.earliest}-{slot.latest}
                      </span>
                      {slot.critical
                        ? <Chip className="bg-blush text-[#93313C]">on the critical path</Chip>
                        : <Chip className="bg-mint text-[#1F6B4C]">{slot.hours_slack}h of slack</Chip>}
                    </div>
                    <p className="mt-2.5 text-[12.5px] leading-relaxed text-ink2">{slot.note}</p>
                    {(slot.blocked_by.length > 0 || slot.blocks.length > 0) && (
                      <div className="mt-2.5 flex flex-wrap gap-x-4 gap-y-1 text-[11.5px] text-muted">
                        {slot.blocked_by.length > 0 && (
                          <span>waits on {slot.blocked_by.map(b => b.title).join(", ")}</span>)}
                        {slot.blocks.length > 0 && (
                          <span>holds up {slot.blocks.map(b => b.title).join(", ")}</span>)}
                      </div>
                    )}
                  </div>
                </div>
              )}

              {impact && (
                <div>
                  <h4 className="mb-2.5 text-[11px] font-bold uppercase tracking-wider text-muted">
                    What if you skip it
                  </h4>
                  <div className={"rounded-3xl p-4 " +
                    (impact.verdict === "goal-critical" ? "bg-blush/60"
                      : impact.verdict === "blocking" ? "bg-peach/60" : "bg-mint/50")}>
                    <Chip className={impact.verdict === "goal-critical" ? "bg-ink text-white"
                      : impact.verdict === "blocking" ? "bg-white/70 text-[#8A5713]"
                        : "bg-white/70 text-[#1F6B4C]"}>
                      {impact.verdict === "goal-critical" ? "cannot be skipped"
                        : impact.verdict === "blocking" ? "blocks later work" : "safe to skip"}
                    </Chip>
                    <p className="mt-2.5 text-[12.5px] leading-relaxed text-ink2">{impact.sentence}</p>
                    {impact.blocked_courses.length > 0 && (
                      <div className="mt-2.5 space-y-1">
                        {impact.blocked_courses.slice(0, 4).map(b => (
                          <div key={b.course_id} className="text-[11.5px] text-ink/70">
                            step {b.order} <span className="font-semibold">{b.title}</span>
                            <span className="text-muted"> needs {b.via_named.join(", ")}</span>
                          </div>
                        ))}
                        {impact.blocked_courses.length > 4 && (
                          <div className="text-[11px] text-muted">
                            +{impact.blocked_courses.length - 4} more
                          </div>)}
                      </div>
                    )}
                    {impact.alternatives.length > 0 && (
                      <p className="mt-2 text-[11.5px] text-muted">
                        {impact.alternatives.length} other course
                        {impact.alternatives.length > 1 ? "s" : ""} in the catalogue teach the
                        same skills, so you could swap rather than skip.
                      </p>
                    )}
                  </div>
                </div>
              )}

              <div className="rounded-3xl p-4" style={{ background: col.soft }}>
                <div className="mb-2 flex items-center gap-2">
                  <h4 className="text-[11px] font-bold uppercase tracking-wider" style={{ color: col.deep }}>In plain words</h4>
                  <Chip className={data.narrative.source.startsWith("ollama") ? "bg-ink text-white" : "bg-white/80 text-ink2"}>
                    {data.narrative.source.startsWith("ollama") ? "reworded by ollama" : "straight from the graph"}
                  </Chip>
                </div>
                <p className="text-[13.5px] leading-relaxed text-ink2">{data.narrative.text}</p>
              </div>

              <p className="text-[11.5px] leading-relaxed text-muted">
                Every statement above is derived from prerequisite edges in the skill graph.
                The language model never decides what you should learn or in what order - at most
                it rephrases the sentences the graph already produced.
              </p>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* -------------------------------------------------- shared modal shell */
function Modal({ children, onClose, wide }) {
  useEffect(() => {
    const onKey = e => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);
  return (
    <div className="fixed inset-0 z-50 flex items-start justify-center overflow-y-auto bg-ink/25 p-4 backdrop-blur-[3px]"
      onClick={onClose}>
      <div className={"my-8 w-full overflow-hidden rounded-4xl bg-surf shadow-lift rise " +
        (wide ? "max-w-3xl" : "max-w-2xl")} onClick={e => e.stopPropagation()}>
        {children}
      </div>
    </div>
  );
}

/* -------------------------------------------------- skill node inspector */
function SkillDot({ s }) {
  const tone = s.possessed ? "#1F6B4C" : s.in_gap ? "#8A5713" : "#C6C0B4";
  const title = s.possessed ? "already in your profile"
    : s.in_gap ? "still needed for your goal" : "not required for your goal";
  return <span title={title} className="h-1.5 w-1.5 shrink-0 rounded-full" style={{ background: tone }} />;
}

function SkillModal({ skillId, onOpenSkill, onClose }) {
  const [d, setD] = useState(null);
  const [err, setErr] = useState(null);

  useEffect(() => {
    setD(null); setErr(null);
    api("/api/graph/skill/" + skillId).then(setD).catch(e => setErr(e.message));
  }, [skillId]);

  const col = phase(d ? d.category : null);
  const standing = () => {
    if (!d || !d.learner) return null;
    if (d.learner.possessed) return { text: "Already in your profile", cls: "bg-mint text-[#1F6B4C]" };
    if (d.learner.scheduled) return {
      text: `Scheduled: step ${d.learner.scheduled.order} in ${d.learner.scheduled.milestone}`,
      cls: "bg-ink text-white",
    };
    if (d.learner.in_gap) return { text: "In your gap, not yet scheduled", cls: "bg-peach text-[#8A5713]" };
    return { text: "Not required for your current goal", cls: "bg-cream text-muted" };
  };
  const st = standing();

  const list = (items, empty) => (
    <div className="flex flex-wrap gap-1.5">
      {items.length === 0 && <span className="text-[12px] text-muted">{empty}</span>}
      {items.map(s => (
        <button key={s.id} onClick={() => onOpenSkill(s.id)}
          className="flex items-center gap-1.5 rounded-full bg-cream px-3 py-1.5 text-[11.5px] font-semibold text-ink2 transition hover:bg-hair/70">
          <SkillDot s={s} /> {s.name}
        </button>
      ))}
    </div>
  );

  return (
    <Modal onClose={onClose}>
      {!d && !err && <div className="flex items-center gap-2 p-10 text-[13px] text-muted"><Spinner /> reading the node...</div>}
      {err && <div className="p-6 text-[13px] text-[#93313C]">{err}</div>}
      {d && (
        <div>
          <header className="flex items-start justify-between gap-4 p-6" style={{ background: col.bg }}>
            <div>
              <div className="text-[10.5px] font-bold uppercase tracking-wider" style={{ color: col.deep }}>
                {d.category} - depth {d.depth} in the graph
              </div>
              <h3 className="mt-1.5 text-[22px] font-extrabold leading-tight tracking-tight text-ink">{d.name}</h3>
              {st && <Chip className={"mt-2 " + st.cls}>{st.text}</Chip>}
            </div>
            <button onClick={onClose}
              className="rounded-full bg-white/70 px-3.5 py-1.5 text-[12px] font-bold text-ink transition hover:bg-white">
              close
            </button>
          </header>

          <div className="space-y-5 p-6">
            <p className="text-[13px] leading-relaxed text-ink2">{d.description}</p>

            <div className="grid gap-5 md:grid-cols-2">
              <div>
                <h4 className="mb-2.5 text-[11px] font-bold uppercase tracking-wider text-muted">
                  Requires ({d.requires.length})
                </h4>
                {list(d.requires, "Nothing - this is an entry point into the graph.")}
              </div>
              <div>
                <h4 className="mb-2.5 text-[11px] font-bold uppercase tracking-wider text-muted">
                  Unlocks ({d.unlocks.length})
                </h4>
                {list(d.unlocks, "Nothing depends on it - it is a leaf.")}
              </div>
            </div>

            <div>
              <h4 className="mb-2.5 text-[11px] font-bold uppercase tracking-wider text-muted">
                Taught by ({d.taught_by.length})
              </h4>
              <div className="space-y-1.5">
                {d.taught_by.map(c => (
                  <div key={c.id}
                    className={"flex flex-wrap items-center gap-2 rounded-2xl px-3 py-2 text-[12.5px] " +
                      (c.in_your_path ? "bg-ink text-white" : "bg-cream text-ink2")}>
                    <span className="font-semibold">{c.title}</span>
                    <span className={c.in_your_path ? "text-white/60" : "text-muted"}>
                      {c.provider} - {c.hours}h - {LEVEL_LABEL[c.level]}
                    </span>
                    {c.in_your_path && <Chip className="bg-white/20 text-white">in your path</Chip>}
                  </div>
                ))}
              </div>
            </div>

            <p className="text-[11.5px] leading-relaxed text-muted">
              Click any skill above to walk the graph. Green means you already have it,

/* ------------------------------------------------ browse the whole graph */
function BrowserModal({ onOpenSkill, onClose }) {
  const [skills, setSkills] = useState([]);
  const [q, setQ] = useState("");

  useEffect(() => { api("/api/skills").then(d => setSkills(d.skills)).catch(() => {}); }, []);

  const groups = {};
  skills.forEach(s => {
    if (q && !(s.name.toLowerCase().includes(q.toLowerCase()) || s.id.includes(q.toLowerCase())
      || s.description.toLowerCase().includes(q.toLowerCase()))) return;
    (groups[s.category] = groups[s.category] || []).push(s);
  });
  const shown = Object.values(groups).reduce((n, g) => n + g.length, 0);

  return (
    <Modal onClose={onClose} wide>
      <header className="flex items-start justify-between gap-4 bg-lilac p-6">
        <div>
          <div className="text-[10.5px] font-bold uppercase tracking-wider text-[#4B3A9E]">The skill graph</div>
          <h3 className="mt-1.5 text-[22px] font-extrabold leading-tight tracking-tight text-ink">
            Browse every skill
          </h3>

            {shown} of {skills.length} skills - click one to see its prerequisites and courses.

          close
        </button>
      </header>
      <div className="p-6">
        <input value={q} onChange={e => setQ(e.target.value)} autoFocus
          placeholder="search skills..."
          className="mb-4 w-full rounded-2xl border border-hair bg-cream/60 px-4 py-2.5 text-[13px] outline-none transition placeholder:text-muted focus:border-ink/25 focus:bg-surf" />
        <div className="scroll-y max-h-[55vh] space-y-4 pr-1">
          {Object.keys(groups).map(cat => (
            <div key={cat}>
              <div className="mb-2 flex items-center gap-2">
                <span className="h-2.5 w-2.5 rounded-full" style={{ background: phase(cat).bg }} />
                <span className="text-[11px] font-bold uppercase tracking-wider" style={{ color: phase(cat).deep }}>

              </div>
              <div className="flex flex-wrap gap-1.5">

                  <button key={s.id} title={s.description} onClick={() => onOpenSkill(s.id)}
                    style={{ background: phase(cat).soft, color: phase(cat).deep }}

                    {s.name}

        </div>
      </div>
    </Modal>
  );
}
